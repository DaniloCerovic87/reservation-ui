<mat-toolbar class="toolbar" color="primary">
  <button mat-icon-button (click)="prevDay()" aria-label="Previous day">
    <mat-icon>chevron_left</mat-icon>
  </button>

  <button mat-button (click)="today()">Today</button>

  <button mat-icon-button (click)="nextDay()" aria-label="Next day">
    <mat-icon>chevron_right</mat-icon>
  </button>

  <span class="spacer"></span>

  <mat-button-toggle-group
    [(ngModel)]="viewMode"
    aria-label="Filter rezervacija"
    class="filterGroup"
  >
    <mat-button-toggle value="ALL">Sve</mat-button-toggle>

    @if (!isAdmin) {
      <mat-button-toggle value="MINE">Moje</mat-button-toggle>
    }
  </mat-button-toggle-group>


  <span class="spacer"></span>

  <mat-form-field appearance="outline" class="dateField">
    <input
      matInput
      [matDatepicker]="picker"
      [value]="selectedDate"
      (dateChange)="onDatePicked($event.value)"
    />
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <!-- USER (SVG avatar, no name in toolbar) -->
  @if (user$ | async; as u) {
    <button
      mat-icon-button
      class="userBtn"
      [matMenuTriggerFor]="userMenu"
      aria-label="Account"
      matTooltip="Ulogovan"
    >
      <span class="userIconWrap">
        <svg
          class="userAvatar"
          width="32"
          height="32"
          viewBox="0 0 32 32"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <circle cx="16" cy="16" r="15" fill="#EEF2F5"></circle>
          <circle cx="16" cy="12" r="4.5" fill="#7A7F86"></circle>
          <path
            d="M8.2 26.0c1.7-4.6 5.0-6.9 7.8-6.9s6.1 2.3 7.8 6.9"
            fill="#7A7F86"
            opacity="0.96"
          ></path>
          <circle cx="24.2" cy="24.8" r="4.0" fill="#22c55e" stroke="#EEF2F5" stroke-width="2"></circle>
        </svg>
      </span>
    </button>

    <mat-menu
      #userMenu="matMenu"
      xPosition="before"
      yPosition="below"
      class="userMenu"
    >
      <button mat-menu-item disabled class="userMenuItem userMenuItem--header">
        <mat-icon class="userMenuIcon">person</mat-icon>
        <span class="userMenuText">{{ u?.username ?? u?.email ?? 'User' }}</span>
      </button>

      <!-- Role (NOT disabled) -->
      @if (u?.role) {
        <button
          mat-menu-item
          class="userMenuItem userMenuItem--role"
          (click)="$event.stopPropagation()"
        >
          <mat-icon class="userMenuIcon">verified_user</mat-icon>
          <span class="userMenuText">{{ u.role }}</span>
        </button>
      }

      <mat-divider class="userMenuDivider"></mat-divider>

      <button
        mat-menu-item
        (click)="logout()"
        class="userMenuItem userMenuItem--logout"
      >
        <mat-icon class="userMenuIcon">logout</mat-icon>
        <span class="userMenuText">Logout</span>
      </button>
    </mat-menu>
  } @else {
    <!-- loading placeholder so layout doesn't jump -->
    <button
      mat-icon-button
      class="userBtn userBtn--loading"
      disabled
      aria-label="Loading user"
    >
      <mat-icon>person_outline</mat-icon>
    </button>
  }
</mat-toolbar>

<div class="content">
  <app-calendar-grid
    [selectedDate]="selectedDateIso"
    [showOnlyMine]="viewMode === 'MINE'"
    [myEmployeeId]="myEmployeeId"
    [isAdmin]="isAdmin"
  ></app-calendar-grid>
</div>
