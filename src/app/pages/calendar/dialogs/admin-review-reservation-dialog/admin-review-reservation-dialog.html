<h2 mat-dialog-title>Review reservation</h2>

<div mat-dialog-content>
  @if (errorMsg) {
    <div class="errorBanner" role="alert">
      {{ errorMsg }}
    </div>
  }

  <div class="row"><span class="label">Name</span><span>{{ data.reservation.reservationName }}</span></div>
  <div class="row"><span class="label">Employee</span><span>{{ data.reservation.employeeName }}</span></div>
  <div class="row"><span class="label">Room</span><span>{{ data.reservation.roomName }}</span></div>
  <div class="row"><span class="label">Time</span>
    <span>{{ hhmm(data.reservation.startTime) }}–{{ hhmm(data.reservation.endTime) }}</span>
  </div>
</div>

<div align="end" mat-dialog-actions>
  <button (click)="close()" [disabled]="saving" mat-button>Cancel</button>

  <button (click)="decline()" [disabled]="saving" mat-stroked-button>
    Decline
  </button>

  <button (click)="approve()" [disabled]="saving" color="primary" mat-flat-button>
    Approve
  </button>
</div>
